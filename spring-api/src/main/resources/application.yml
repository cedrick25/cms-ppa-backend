server:
  port: 8080

spring:
  application:
    name: cms-ppa-api
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_DATABASE:cms_ppa}?characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

cms:
  app-key: ${APP_KEY:}
  display-timezone: ${CMS_DISPLAY_TIMEZONE:Asia/Manila}
  schema-init: true
  bcrypt-rounds: ${BCRYPT_ROUNDS:12}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  admin:
    name: ${CMS_ADMIN_NAME:}
    username: ${CMS_ADMIN_USERNAME:}
    email: ${CMS_ADMIN_EMAIL:}
    password: ${CMS_ADMIN_PASSWORD:}
  sign-ins:
    dashboard-limit: ${CMS_SIGN_INS_DASHBOARD_LIMIT:8}
    retention-days: ${CMS_SIGN_INS_RETENTION_DAYS:90}
  notifications:
    dashboard-limit: ${CMS_NOTIFICATIONS_DASHBOARD_LIMIT:20}
    down-after-failures: ${CMS_NOTIFICATIONS_DOWN_AFTER_FAILURES:2}
    read-retention-days: ${CMS_NOTIFICATIONS_READ_RETENTION_DAYS:30}
    retention-days: ${CMS_NOTIFICATIONS_RETENTION_DAYS:90}
  system-status:
    interval-minutes: ${SYSTEM_STATUS_INTERVAL_MINUTES:5}
    timeout-seconds: ${SYSTEM_STATUS_TIMEOUT_SECONDS:5}
    connect-timeout-seconds: ${SYSTEM_STATUS_CONNECT_TIMEOUT_SECONDS:3}
    concurrency: ${SYSTEM_STATUS_CONCURRENCY:5}
    batch-size: ${SYSTEM_STATUS_BATCH_SIZE:50}
    max-backoff-minutes: ${SYSTEM_STATUS_MAX_BACKOFF_MINUTES:60}
    stale-after-minutes: ${SYSTEM_STATUS_STALE_AFTER_MINUTES:10}
    verify-tls: ${SYSTEM_STATUS_VERIFY_TLS:true}
  audit:
    per-page: ${CMS_AUDIT_PER_PAGE:20}
    cms-per-page: ${CMS_CMS_AUDIT_PER_PAGE:20}
    sync-limit: ${CMS_AUDIT_SYNC_LIMIT:2000}
    statement-timeout-ms: ${CMS_AUDIT_STATEMENT_TIMEOUT_MS:8000}
    uams:
      host: ${AUDIT_UAMS_HOST:${DB_HOST:127.0.0.1}}
      port: ${AUDIT_UAMS_PORT:${DB_PORT:3306}}
      database: ${AUDIT_UAMS_DATABASE:}
      username: ${AUDIT_UAMS_USERNAME:${DB_USERNAME:root}}
      password: ${AUDIT_UAMS_PASSWORD:${DB_PASSWORD:}}
    cmis:
      host: ${AUDIT_CMIS_HOST:${DB_HOST:127.0.0.1}}
      port: ${AUDIT_CMIS_PORT:${DB_PORT:3306}}
      database: ${AUDIT_CMIS_DATABASE:}
      username: ${AUDIT_CMIS_USERNAME:${DB_USERNAME:root}}
      password: ${AUDIT_CMIS_PASSWORD:${DB_PASSWORD:}}
    ppis:
      host: ${AUDIT_PPIS_HOST:${DB_HOST:127.0.0.1}}
      port: ${AUDIT_PPIS_PORT:${DB_PORT:3306}}
      database: ${AUDIT_PPIS_DATABASE:}
      username: ${AUDIT_PPIS_USERNAME:${DB_USERNAME:root}}
      password: ${AUDIT_PPIS_PASSWORD:${DB_PASSWORD:}}
